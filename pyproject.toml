[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "sona_oversampling"
version = "0.2.0"
authors = [
  { name="Supakit Sroynam", email="6534467323@student.chula.ac.th" },
]
description = "Stochastic directional Oversampling using Negative Anomalous scores (SONA)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "scipy>=1.8",
    "scikit-learn>=1.3",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICENSE*"]

[project.optional-dependencies]
experiments = [
    "pandas>=2.1",
    "matplotlib",
    "statsmodels",
    "optuna",
    "xgboost",
    "imbalanced-learn",
    "smote-variants",
    "sdv>=1.17",
]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/oakkao/sona-oversampling"
